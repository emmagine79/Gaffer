[project]
name = "gaffer-service"
version = "0.1.0"
description = "Gaffer's light service: controls studio lights over Bluetooth and serves the web interface. Built on Rkcr7/lumen-studio (MIT)."
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.0.2",
    "fastapi>=0.143.3",
    "godox-mesh-bt",
    # Draws the phone-access QR code (SPEC-015). BSD-3, licence in THIRD-PARTY/segno/.
    "segno>=1.6.6",
    # [standard] brings the WebSocket library the /ws endpoint needs.
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives at service/gaffer, not service/src/gaffer.
module-root = ""
module-name = "gaffer"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
godox-mesh-bt = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/godox-mesh-bt/tests"]
