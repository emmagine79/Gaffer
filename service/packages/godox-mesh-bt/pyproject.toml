[project]
name = "godox-mesh-bt"
version = "1.0.0"
description = "Python BLE library and CLI for Godox Bluetooth Mesh LED lights"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Matt Harrison"}]
keywords = ["godox", "bluetooth", "ble", "mesh", "led", "lighting"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=3.0.2",
    "cryptography>=47.0.0",
]

[project.urls]
Upstream = "https://github.com/mattharrison/godox-ul60bi-bt"
"Home Assistant fork" = "https://github.com/binary-person/ha-godox-mesh"

[project.scripts]
godox-mesh = "godox_mesh_bt.cli:run"
godox-parse-capture = "godox_mesh_bt.research.parse_capture:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio",
]
