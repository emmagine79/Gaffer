<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaffer remote</title>
<!--
  The Kindle remote (GET /kindle). One file, no build step, no imports.
  Written for an e-ink Kindle's browser: ES5 only (var, function, XMLHttpRequest), black on white,
  no animation, big targets, and the DOM is touched only where a value changed, so the screen
  redraws as little as possible. It talks to the same /api/session and /ws as the Glass page.
-->
<style>
  /* E-ink: pure black on pure white is deliberate here. Grey tints dither on a Paperwhite, so grey
     is used only for things that are off or disabled.
     Spacing steps: 4, 8, 12, 16. Type steps: 14, 17, 20, 24.
     Compact: a light is two rows (name, Max and power; then brightness and colour temperature side
     by side), so three lights and All on/off fit a Paperwhite's 536 x 724 point screen. Touch
     targets are at least 44 points; the ones used most (+, -, All on/off) are 60, about 10 mm. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  body { font: 20px/1.25 "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 8px 12px 12px;
         -webkit-user-select: none; user-select: none; }
  button { font: inherit; font-weight: bold; color: #000; background: #fff; border: 3px solid #000;
           border-radius: 12px; min-height: 56px; padding: 4px 12px; margin: 0; cursor: pointer;
           touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:active, button[aria-pressed="true"] { background: #000; color: #fff; }
  button:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
  button:disabled { border-style: dashed; color: #666; background: #fff; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.02em; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; margin: 16px 0 8px; }

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 8px;
         border-bottom: 2px solid #000; }
  #lookNow { flex: 1 1 auto; min-width: 0; text-align: center; font-size: 17px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Connected is a filled dot; anything else is a hollow one, readable at a glance. */
  #status { font-size: 14px; white-space: nowrap; }
  #status::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px;
                    border: 2px solid #000; border-radius: 50%; background: #000; vertical-align: -1px; }
  #status.bad { font-weight: bold; }
  #status.bad::before { background: #fff; }
  #exit { min-height: 44px; padding: 0 14px; font-size: 17px; margin-left: 4px; }

  .row { display: flex; gap: 8px; }
  .row > button { flex: 1 1 0; min-height: 60px; }
  #cue { margin-top: 8px; }
  #lights, #empty { margin-top: 12px; }
  #empty { font-size: 17px; }

  .light { border: 3px solid #000; border-radius: 14px; padding: 8px 12px 12px; margin: 0 0 8px; }
  .light.off { border-style: dashed; }
  .light.off .val { color: #666; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .head > div { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .name { font-size: 24px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { font-size: 14px; white-space: nowrap; }
  .switches { display: flex; gap: 8px; flex: 0 0 auto; }
  .power { min-width: 96px; min-height: 52px; }
  .max { min-width: 72px; min-height: 52px; }

  .ctls { display: flex; gap: 12px; }
  /* Each control takes half the card, even when it is alone (a light with no white has no colour
     temperature), so brightness lines up from card to card. */
  .ctl { flex: 0 0 calc(50% - 6px); display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ctl > button { width: 60px; flex: 0 0 60px; min-height: 60px; padding: 0; font-size: 30px; }
  .val { flex: 1 1 auto; min-width: 0; text-align: center; white-space: nowrap; }
  .val span { font-size: 24px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .val small { display: block; font-size: 14px; }
  /* A level bar under each value: where the light sits in its range, readable from across the room. */
  .meter { height: 8px; margin: 4px 4px 0; border: 2px solid #000; border-radius: 4px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: #000; }

  .looks { display: flex; flex-wrap: wrap; gap: 8px; }
  .looks > button { flex: 1 1 30%; min-height: 52px; font-size: 17px; }
  #message { min-height: 1.2em; font-size: 17px; margin: 8px 0 0; }
  /* Sized so the whole pad, title to bottom row, fits a Paperwhite's 536 x 724 point screen. */
  .pin { max-width: 560px; margin: 8px auto 0; text-align: center; }
  .pin p { font-size: 24px; margin: 12px 0; }
  #pinValue { font-size: 52px; letter-spacing: 12px; min-height: 68px; border-bottom: 3px solid #000; margin: 6px 0 16px; }
  .keys { display: flex; flex-wrap: wrap; gap: 12px; }
  .keys > button { flex: 1 1 30%; min-height: 96px; font-size: 40px; }
  #empty { font-size: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="studio" hidden>
  <div class="top">
    <h1>Gaffer</h1>
    <span id="lookNow" class="note">No look on</span>
    <span id="status" role="status">Connecting</span>
    <button type="button" id="exit">Exit</button>
  </div>
  <div class="row">
    <button type="button" id="allOn">All on</button>
    <button type="button" id="allOff">All off</button>
  </div>
  <div id="cue" class="row" hidden>
    <button type="button" id="cueBack">Back</button>
    <button type="button" id="cueGo">Go</button>
  </div>
  <section aria-label="Lights">
    <p id="empty">Looking for lights. Lights appear here once the Mac finds them.</p>
    <div id="lights"></div>
  </section>
  <section id="looksSection" hidden>
    <h2>Looks</h2>
    <div id="looks" class="looks"></div>
  </section>
  <p id="message" role="alert"></p>
</main>

<main id="pinScreen" class="pin" hidden>
  <h1>Gaffer</h1>
  <p id="pinNote">Enter the PIN shown on the Mac, under Phone.</p>
  <div id="pinValue" aria-label="PIN entered" aria-live="polite"></div>
  <div class="keys" id="keys"></div>
</main>

<main id="blocked" class="pin" hidden>
  <h1>Gaffer</h1>
  <p id="blockedText" role="alert"></p>
  <button type="button" id="retry">Try again</button>
</main>

<script>
(function () {
  'use strict';

  // The PIN is kept on this device so the remote signs itself back in after Gaffer or the Kindle restarts.
  // The service keeps the same PIN across restarts until someone presses New PIN on the Mac.
  var PIN_KEY = 'gaffer.kindle.pin';
  // One tap moves brightness 1% and colour temperature 100 K. Held, a button repeats after
  // HOLD_DELAY ms, every REPEAT_MS ms, and the step grows the longer it is held (SPEEDS: 1x for the
  // first 8 repeats, 2x for the next 8, then 5x), so 0 to 100% takes about 3.5 seconds.
  var LEVEL_STEP = 1;
  var KELVIN_STEP = 100;
  var HOLD_DELAY = 400;
  var REPEAT_MS = 100;
  var SPEEDS = [{ after: 0, times: 1 }, { after: 8, times: 2 }, { after: 16, times: 5 }];
  // What this remote last asked a light for is shown, and stepped from, until the light's own
  // state has had PENDING_MS to come back. Otherwise fast taps would all step from the same old value.
  var PENDING_MS = 1500;
  var pending = {};     // id -> {brightness?, kelvin?, at}
  var holds = [];       // stop functions for every held button, run when the page loses focus

  var lights = {};      // id -> light object from the service
  var order = [];       // light ids in the service's order
  var rows = {};        // id -> {root, power, level, kelvin, ...}
  var looksList = [];
  var socket = null;
  var retry = 0;
  var rid = 0;
  var pinTyped = '';
  var signingIn = false;

  function $(id) { return document.getElementById(id); }

  function setText(node, text) {
    if (node.textContent !== text) node.textContent = text;
  }

  function show(which) {
    var screens = ['studio', 'pinScreen', 'blocked'];
    for (var i = 0; i < screens.length; i++) {
      var hidden = screens[i] !== which;
      if ($(screens[i]).hidden !== hidden) $(screens[i]).hidden = hidden;
    }
  }

  function savedPin() {
    try { return window.localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; }
  }

  function savePin(pin) {
    try {
      if (pin) window.localStorage.setItem(PIN_KEY, pin);
      else window.localStorage.removeItem(PIN_KEY);
    } catch (e) { /* no storage: the remote still works, it asks for the PIN again after a restart */ }
  }

  function request(method, path, body, done) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, path, true);
    if (body !== null) xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var data = {};
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) { data = {}; }
      done(xhr.status, data);
    };
    xhr.send(body === null ? null : JSON.stringify(body));
  }

  // -- signing in ------------------------------------------------------------------------------

  function check() {
    request('GET', '/api/session', null, function (status, data) {
      if (status === 200) return openStudio();
      if (status === 0) return blocked('Cannot reach Gaffer. Check that the Mac is on and awake.', true);
      if (data.error === 'pin_required') {
        var pin = savedPin();
        if (pin) return signIn(pin, true);
        return askPin('Enter the PIN shown on the Mac, under Phone.');
      }
      blocked(data.message || 'Gaffer is not available.', true);
    });
  }

  function signIn(pin, saved) {
    if (signingIn) return;
    signingIn = true;
    request('POST', '/api/session', { pin: pin }, function (status, data) {
      signingIn = false;
      if (status === 200) {
        savePin(pin);
        pinTyped = '';
        return openStudio();
      }
      if (status === 0) return blocked('Cannot reach Gaffer. Check that the Mac is on and awake.', true);
      if (data.error === 'wrong_pin' || data.error === 'bad_pin') {
        // A saved PIN that no longer works was replaced on the Mac: forget it, never guess again.
        savePin('');
        pinTyped = '';
        return askPin(saved ? 'The PIN changed on the Mac. Enter the new one.' : 'That PIN is not right. Try again.');
      }
      // Locked after too many wrong PINs: forget the saved one and offer Try again, which asks for
      // the PIN once New PIN on the Mac has cleared the lock.
      if (data.error === 'pin_locked') { savePin(''); pinTyped = ''; }
      blocked(data.message || 'Gaffer is not available.', true);
    });
  }

  function askPin(note) {
    setText($('pinNote'), note);
    drawPin();
    show('pinScreen');
  }

  function drawPin() {
    var dots = '';
    for (var i = 0; i < pinTyped.length; i++) dots += '\u25CF';
    setText($('pinValue'), dots);
  }

  function buildKeys() {
    var labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Clear', '0', 'Delete'];
    var keys = $('keys');
    for (var i = 0; i < labels.length; i++) {
      (function (label) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.onclick = function () {
          if (label === 'Clear') pinTyped = '';
          else if (label === 'Delete') pinTyped = pinTyped.slice(0, -1);
          else if (pinTyped.length < 6) pinTyped += label;
          drawPin();
          if (pinTyped.length === 6) signIn(pinTyped, false);
        };
        keys.appendChild(b);
      })(labels[i]);
    }
  }

  function blocked(text, canRetry) {
    setText($('blockedText'), text);
    $('retry').hidden = !canRetry;
    show('blocked');
    if (canRetry) later(check);
  }

  // Ask again after a pause that doubles each time, as the Glass page's socket does (400 ms up to 8 s).
  var retryTimer = null;
  function later(fn) {
    if (retryTimer) clearTimeout(retryTimer);
    var delay = Math.min(8000, 400 * Math.pow(2, retry++));
    retryTimer = setTimeout(function () { retryTimer = null; fn(); }, delay);
  }

  // -- the studio ------------------------------------------------------------------------------

  function openStudio() {
    show('studio');
    connect();
  }

  function connect() {
    if (socket) return;
    setStatus('Connecting', false);
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var ws = new WebSocket(scheme + location.host + '/ws');
    socket = ws;
    ws.onopen = function () { retry = 0; setStatus('Connected', false); };
    ws.onmessage = function (event) {
      var m;
      try { m = JSON.parse(event.data); } catch (e) { return; }
      receive(m);
    };
    ws.onclose = function (event) {
      if (socket === ws) socket = null;
      setStatus('Reconnecting', true);
      // 4401 is a sign-out (New PIN) or a restart that forgot this browser; 4403 is phone access off.
      if (event.code === 4401 || event.code === 4403) return later(check);
      later(function () { check(); });
    };
  }

  function send(message) {
    if (!socket || socket.readyState !== 1) {
      flash('Not connected yet.');
      return;
    }
    rid += 1;
    message.rid = 'k' + rid;
    socket.send(JSON.stringify(message));
  }

  function setStatus(text, bad) {
    setText($('status'), text);
    var cls = bad ? 'bad' : '';
    if ($('status').className !== cls) $('status').className = cls;
  }

  var flashTimer = null;
  function flash(text) {
    setText($('message'), text);
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { setText($('message'), ''); }, 6000);
  }

  function receive(m) {
    switch (m.type) {
      case 'hello':
        setLights(m.lights || []);
        setLooks((m.store && m.store.looks) || []);
        setLook(m.look);
        break;
      case 'lights':
        setLights(m.lights || []);
        break;
      case 'state':
        if (lights[m.light]) { lights[m.light].state = m.state; drawLight(m.light); }
        break;
      case 'stats':
        for (var id in lights) {
          var reach = m.reachable ? m.reachable[id] : undefined;
          var held = m.held ? m.held[id] : undefined;
          var max = m.max_mode ? m.max_mode[id] : undefined;
          if ((reach !== undefined && lights[id].reachable !== reach) || (held !== undefined && lights[id].held !== held) ||
              (max !== undefined && lights[id].max_mode !== max)) {
            if (reach !== undefined) lights[id].reachable = reach;
            if (held !== undefined) lights[id].held = held;
            if (max !== undefined) lights[id].max_mode = max;
            drawLight(id);
          }
        }
        break;
      case 'store':
        if (m.collection === 'looks') setLooks(m.items || []);
        break;
      case 'look':
        setLook(m.name);
        break;
      case 'cue':
        setCue(m);
        break;
      case 'error':
        flash(m.text || 'That did not work.');
        break;
      case 'toast':
        if (m.kind === 'error' || m.kind === 'warn') flash(m.text);
        break;
    }
  }

  function setLook(name) {
    setText($('lookNow'), name ? 'Look: ' + name : 'No look on');
  }

  function setCue(m) {
    var active = !!m.id;
    $('cue').hidden = !active;
    if (!active) return;
    setText($('cueGo'), m.next ? 'Go: ' + m.next.name : 'Start again');
  }

  function setLooks(items) {
    var same = items.length === looksList.length;
    for (var i = 0; same && i < items.length; i++) {
      if (items[i].id !== looksList[i].id || items[i].name !== looksList[i].name) same = false;
    }
    looksList = items;
    $('looksSection').hidden = items.length === 0;
    if (same) return;
    var box = $('looks');
    while (box.firstChild) box.removeChild(box.firstChild);
    for (var j = 0; j < items.length; j++) {
      (function (look) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = look.name;
        b.onclick = function () { send({ type: 'looks.apply', id: look.id }); };
        box.appendChild(b);
      })(items[j]);
    }
  }

  function setLights(list) {
    var ids = [];
    for (var i = 0; i < list.length; i++) {
      lights[list[i].id] = list[i];
      ids.push(list[i].id);
    }
    if (ids.join('\n') !== order.join('\n')) {
      order = ids;
      var box = $('lights');
      while (box.firstChild) box.removeChild(box.firstChild);
      rows = {};
      for (var j = 0; j < ids.length; j++) box.appendChild(buildRow(ids[j]));
    }
    for (var k = 0; k < ids.length; k++) drawLight(ids[k]);
    var none = ids.length === 0;
    if ($('empty').hidden === none) $('empty').hidden = !none;
  }

  function hasWhite(light) {
    var f = light.caps && light.caps.features;
    return !!(f && f.white && !f.daylight);
  }

  function button(text, onclick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.onclick = onclick;
    return b;
  }

  // A button that steps once when pressed and keeps stepping, faster and faster, while held.
  // fire(times) is called with the speed multiplier.
  function holdable(b, fire) {
    var delay = null;
    var timer = null;
    var ticks = 0;
    function stop() {
      if (delay) { clearTimeout(delay); delay = null; }
      if (timer) { clearInterval(timer); timer = null; }
    }
    function start(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (b.disabled) return;
      stop();
      ticks = 0;
      fire(1);
      delay = setTimeout(function () {
        delay = null;
        timer = setInterval(function () {
          ticks += 1;
          var times = 1;
          for (var i = 0; i < SPEEDS.length; i++) if (ticks > SPEEDS[i].after) times = SPEEDS[i].times;
          fire(times);
        }, REPEAT_MS);
      }, HOLD_DELAY);
    }
    if (window.PointerEvent) {
      b.addEventListener('pointerdown', start);
      b.addEventListener('pointerup', stop);
      b.addEventListener('pointercancel', stop);
      b.addEventListener('pointerleave', stop);
    } else {
      b.addEventListener('touchstart', start);
      b.addEventListener('touchend', stop);
      b.addEventListener('touchcancel', stop);
      b.addEventListener('mousedown', start);
      b.addEventListener('mouseup', stop);
      b.addEventListener('mouseleave', stop);
    }
    // A long press must not open the browser's menu or select text.
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    // Enter or Space arrives as a click with no pointer behind it: one step.
    b.addEventListener('click', function (e) { if (e.detail === 0) fire(1); });
    holds.push(stop);
  }

  function control(label, short, step) {
    var row = document.createElement('div');
    row.className = 'ctl';
    var down = button('\u2212', null);
    down.setAttribute('aria-label', label + ' down');
    holdable(down, function (times) { step(-times); });
    var up = button('+', null);
    up.setAttribute('aria-label', label + ' up');
    holdable(up, function (times) { step(times); });
    var val = document.createElement('div');
    val.className = 'val';
    var num = document.createElement('span');
    var small = document.createElement('small');
    small.textContent = short;
    var meter = document.createElement('div');
    meter.className = 'meter';
    meter.setAttribute('aria-hidden', 'true');
    var fill = document.createElement('i');
    meter.appendChild(fill);
    val.appendChild(num);
    val.appendChild(small);
    val.appendChild(meter);
    row.appendChild(down);
    row.appendChild(val);
    row.appendChild(up);
    return { row: row, value: num, fill: fill };
  }

  function setWidth(node, percent) {
    var w = Math.max(0, Math.min(100, Math.round(percent))) + '%';
    if (node.style.width !== w) node.style.width = w;
  }

  // What to show and step from: this remote's last ask while it is fresh, else the light's state.
  function wanted(id, key) {
    var p = pending[id];
    if (p && p[key] !== undefined && new Date().getTime() - p.at < PENDING_MS) return p[key];
    var s = (lights[id] && lights[id].state) || {};
    if (key === 'brightness') return Math.round(s.brightness || 0);
    return s.cct && s.cct.kelvin;
  }

  function remember(id, key, value) {
    var now = new Date().getTime();
    var p = pending[id];
    if (!p || now - p.at >= PENDING_MS) p = pending[id] = {};
    p[key] = value;
    p.at = now;
    drawLight(id);
    // Hand the display back to the light's own state once the ask has had time to land.
    setTimeout(function () { drawLight(id); }, PENDING_MS + 50);
  }

  function buildRow(id) {
    var light = lights[id];
    var root = document.createElement('div');
    root.className = 'light';
    var head = document.createElement('div');
    head.className = 'head';
    var titles = document.createElement('div');
    var name = document.createElement('div');
    name.className = 'name';
    var note = document.createElement('div');
    note.className = 'note';
    titles.appendChild(name);
    titles.appendChild(note);
    var power = button('On', function () {
      var l = lights[id];
      send({ type: 'power', light: id, on: !(l.state && l.state.power) });
    });
    power.className = 'power';
    head.appendChild(titles);
    // Max Mode (turbo) sits left of On, only on a light whose model has the switch (the MOLUS G200).
    var max = null;
    if (light.caps && light.caps.max_mode) {
      max = button('Max', function () {
        var l = lights[id];
        if (!(l.state && l.state.power)) { flash('Switch the light on first.'); return; }
        send({ type: 'light.max_mode', light: id, on: !l.max_mode });
      });
      max.className = 'max';
      var switches = document.createElement('span');
      switches.className = 'switches';
      switches.appendChild(max);
      switches.appendChild(power);
      head.appendChild(switches);
    } else {
      head.appendChild(power);
    }
    root.appendChild(head);
    // Brightness and colour temperature share one row, so each light takes two rows, not three.
    var ctls = document.createElement('div');
    ctls.className = 'ctls';
    var level = control('Brightness', 'Brightness', function (times) { nudge(id, LEVEL_STEP * times, 0); });
    ctls.appendChild(level.row);
    var kelvin = null;
    if (hasWhite(light)) {
      kelvin = control('Colour temperature', 'Colour temp', function (times) { nudge(id, 0, KELVIN_STEP * times); });
      ctls.appendChild(kelvin.row);
    }
    root.appendChild(ctls);
    rows[id] = { root: root, name: name, note: note, power: power, max: max,
                 level: level.value, levelFill: level.fill,
                 kelvin: kelvin && kelvin.value, kelvinFill: kelvin && kelvin.fill };
    return root;
  }

  function nudge(id, levelStep, kelvinStep) {
    var l = lights[id];
    if (!l || !l.state) return;
    if (levelStep) {
      var from = wanted(id, 'brightness');
      var level = Math.max(0, Math.min(100, from + levelStep));
      if (level === from && l.state.power) return;  // already at the end of the range
      remember(id, 'brightness', level);
      send({ type: 'set', light: id, patch: { brightness: level, power: true } });
    }
    if (kelvinStep) {
      var caps = l.caps || {};
      var k = wanted(id, 'kelvin') || caps.min_kelvin;
      var next = Math.max(caps.min_kelvin, Math.min(caps.max_kelvin, k + kelvinStep));
      if (next === k && l.state.mode === 'cct') return;
      remember(id, 'kelvin', next);
      send({ type: 'set', light: id, patch: { mode: 'cct', cct: { kelvin: next } } });
    }
  }

  function drawLight(id) {
    var l = lights[id];
    var r = rows[id];
    if (!l || !r) return;
    var s = l.state || {};
    var on = !!s.power;
    setText(r.name, l.name || l.model || 'Light');
    var note = l.reachable === false ? 'Out of reach' : (l.held ? 'Held by another app' : (l.model || ''));
    setText(r.note, note);
    setText(r.power, on ? 'On' : 'Off');
    if (r.power.getAttribute('aria-pressed') !== String(on)) r.power.setAttribute('aria-pressed', String(on));
    if (r.max) {
      var maxOn = l.max_mode === true;
      if (r.max.getAttribute('aria-pressed') !== String(maxOn)) r.max.setAttribute('aria-pressed', String(maxOn));
      if (r.max.disabled !== !on) r.max.disabled = !on;
    }
    var cls = on ? 'light' : 'light off';
    if (r.root.className !== cls) r.root.className = cls;
    var level = wanted(id, 'brightness');
    setText(r.level, level + '%');
    setWidth(r.levelFill, on ? level : 0);
    if (r.kelvin) {
      var caps = l.caps || {};
      var p = pending[id];
      var asked = p && p.kelvin !== undefined && new Date().getTime() - p.at < PENDING_MS;
      var k = asked ? p.kelvin : (s.mode === 'cct' && s.cct ? s.cct.kelvin : null);
      setText(r.kelvin, k ? k + ' K' : 'Colour');
      var span = (caps.max_kelvin || 0) - (caps.min_kelvin || 0);
      setWidth(r.kelvinFill, k && span > 0 ? (k - caps.min_kelvin) / span * 100 : 0);
    }
  }

  $('allOn').onclick = function () { send({ type: 'power.all', on: true }); };
  $('allOff').onclick = function () { send({ type: 'all.off' }); };
  $('cueGo').onclick = function () { send({ type: 'cue.go' }); };
  $('cueBack').onclick = function () { send({ type: 'cue.back' }); };
  $('retry').onclick = function () { retry = 0; check(); };
  // Exit closes the browser. The launcher (kindle/gaffer_remote.sh) sees the browser close and gives
  // the Kindle its own screens back. A page the browser will not let close says what to do instead.
  $('exit').onclick = function () {
    if (socket) {
      socket.onclose = null;  // leaving: do not reconnect
      try { socket.close(); } catch (e) { /* closing anyway */ }
      socket = null;
    }
    setStatus('Closing', false);
    window.close();
    setTimeout(function () { flash('To leave, press the power button once.'); }, 1500);
  };

  // A hold never outlives the page being hidden or losing focus.
  function stopHolds() { for (var i = 0; i < holds.length; i++) holds[i](); }
  window.addEventListener('blur', stopHolds);
  document.addEventListener('visibilitychange', stopHolds);

  buildKeys();
  check();
})();
</script>
</body>
</html>
