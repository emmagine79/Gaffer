<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaffer remote</title>
<!--
  The Kindle remote (GET /kindle). One file, no build step, no imports.
  Written for an e-ink Kindle's browser: ES5 only (var, function, XMLHttpRequest), black on white,
  no animation, big targets, and the DOM is touched only where a value changed, so the screen
  redraws as little as possible. It talks to the same /api/session and /ws as the Glass page.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  /* Compact: a light is two rows (name and power, then brightness and colour temperature side by
     side), so three lights and the all on/off row fit a Paperwhite's 536 x 724 point screen. Buttons
     stay at least 60 points, about 10 mm on the Paperwhite, which is still easy to hit. */
  body { font: 22px/1.25 Helvetica, Arial, sans-serif; padding: 10px 14px 14px; }
  button { font: inherit; color: #000; background: #fff; border: 3px solid #000; border-radius: 12px;
           min-height: 60px; padding: 4px 10px; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { background: #000; color: #fff; }
  button[aria-pressed="true"] { background: #000; color: #fff; }
  button:disabled { border-style: dashed; color: #555; }
  h1 { font-size: 26px; margin: 0; }
  h2 { font-size: 20px; margin: 12px 0 8px; text-transform: none; border-bottom: 2px solid #000; padding-bottom: 2px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  #lookNow { flex: 1 1 auto; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { font-size: 18px; }
  #status.bad { font-weight: bold; }
  .row { display: flex; gap: 10px; }
  .row > button { flex: 1 1 0; font-weight: bold; }
  .looks { display: flex; flex-wrap: wrap; gap: 10px; }
  .looks > button { flex: 1 1 30%; font-weight: bold; }
  .light { border: 3px solid #000; border-radius: 14px; padding: 8px 10px; margin: 0 0 10px; }
  .light.off { border-style: dashed; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .head > div { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .name { font-size: 24px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { font-size: 16px; white-space: nowrap; }
  .power { min-width: 110px; min-height: 52px; font-weight: bold; }
  .ctls { display: flex; gap: 10px; }
  .ctl { flex: 1 1 0; display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ctl > button { width: 60px; flex: 0 0 60px; padding: 0; font-size: 32px; font-weight: bold; }
  .val { flex: 1 1 auto; text-align: center; font-size: 22px; font-weight: bold; white-space: nowrap; }
  .val small { display: block; font-size: 14px; font-weight: normal; }
  #cue { margin-top: 10px; }
  #message { min-height: 1.2em; font-size: 18px; margin: 6px 0 0; }
  /* Sized so the whole pad, title to bottom row, fits a Paperwhite's 536 x 724 point screen. */
  .pin { max-width: 560px; margin: 8px auto 0; text-align: center; }
  .pin p { font-size: 24px; margin: 12px 0; }
  #pinValue { font-size: 52px; letter-spacing: 12px; min-height: 68px; border-bottom: 3px solid #000; margin: 6px 0 16px; }
  .keys { display: flex; flex-wrap: wrap; gap: 12px; }
  .keys > button { flex: 1 1 30%; min-height: 96px; font-size: 40px; }
  #empty { font-size: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="studio" hidden>
  <div class="top">
    <h1>Gaffer</h1>
    <span id="lookNow" class="note">No look on</span>
    <span id="status" role="status">Connecting</span>
  </div>
  <div class="row">
    <button type="button" id="allOn">All on</button>
    <button type="button" id="allOff">All off</button>
  </div>
  <div id="cue" class="row" hidden>
    <button type="button" id="cueBack">Back</button>
    <button type="button" id="cueGo">Go</button>
  </div>
  <section>
    <h2>Lights</h2>
    <p id="empty">Looking for lights. Lights appear here once the Mac finds them.</p>
    <div id="lights"></div>
  </section>
  <section id="looksSection" hidden>
    <h2>Looks</h2>
    <div id="looks" class="looks"></div>
  </section>
  <p id="message" role="alert"></p>
</main>

<main id="pinScreen" class="pin" hidden>
  <h1>Gaffer</h1>
  <p id="pinNote">Enter the PIN shown on the Mac, under Phone.</p>
  <div id="pinValue" aria-label="PIN entered" aria-live="polite"></div>
  <div class="keys" id="keys"></div>
</main>

<main id="blocked" class="pin" hidden>
  <h1>Gaffer</h1>
  <p id="blockedText" role="alert"></p>
  <button type="button" id="retry">Try again</button>
</main>

<script>
(function () {
  'use strict';

  // The PIN is kept on this device so the remote signs itself back in after Gaffer or the Kindle restarts.
  // The service keeps the same PIN across restarts until someone presses New PIN on the Mac.
  var PIN_KEY = 'gaffer.kindle.pin';
  // Brightness and colour temperature move in the steps the Glass page uses for its keyboard jumps.
  var LEVEL_STEP = 5;
  var KELVIN_STEP = 100;

  var lights = {};      // id -> light object from the service
  var order = [];       // light ids in the service's order
  var rows = {};        // id -> {root, power, level, kelvin, ...}
  var looksList = [];
  var socket = null;
  var retry = 0;
  var rid = 0;
  var pinTyped = '';
  var signingIn = false;

  function $(id) { return document.getElementById(id); }

  function setText(node, text) {
    if (node.textContent !== text) node.textContent = text;
  }

  function show(which) {
    var screens = ['studio', 'pinScreen', 'blocked'];
    for (var i = 0; i < screens.length; i++) {
      var hidden = screens[i] !== which;
      if ($(screens[i]).hidden !== hidden) $(screens[i]).hidden = hidden;
    }
  }

  function savedPin() {
    try { return window.localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; }
  }

  function savePin(pin) {
    try {
      if (pin) window.localStorage.setItem(PIN_KEY, pin);
      else window.localStorage.removeItem(PIN_KEY);
    } catch (e) { /* no storage: the remote still works, it asks for the PIN again after a restart */ }
  }

  function request(method, path, body, done) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, path, true);
    if (body !== null) xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var data = {};
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) { data = {}; }
      done(xhr.status, data);
    };
    xhr.send(body === null ? null : JSON.stringify(body));
  }

  // -- signing in ------------------------------------------------------------------------------

  function check() {
    request('GET', '/api/session', null, function (status, data) {
      if (status === 200) return openStudio();
      if (status === 0) return blocked('Cannot reach Gaffer. Check that the Mac is on and awake.', true);
      if (data.error === 'pin_required') {
        var pin = savedPin();
        if (pin) return signIn(pin, true);
        return askPin('Enter the PIN shown on the Mac, under Phone.');
      }
      blocked(data.message || 'Gaffer is not available.', true);
    });
  }

  function signIn(pin, saved) {
    if (signingIn) return;
    signingIn = true;
    request('POST', '/api/session', { pin: pin }, function (status, data) {
      signingIn = false;
      if (status === 200) {
        savePin(pin);
        pinTyped = '';
        return openStudio();
      }
      if (status === 0) return blocked('Cannot reach Gaffer. Check that the Mac is on and awake.', true);
      if (data.error === 'wrong_pin' || data.error === 'bad_pin') {
        // A saved PIN that no longer works was replaced on the Mac: forget it, never guess again.
        savePin('');
        pinTyped = '';
        return askPin(saved ? 'The PIN changed on the Mac. Enter the new one.' : 'That PIN is not right. Try again.');
      }
      // Locked after too many wrong PINs: forget the saved one and offer Try again, which asks for
      // the PIN once New PIN on the Mac has cleared the lock.
      if (data.error === 'pin_locked') { savePin(''); pinTyped = ''; }
      blocked(data.message || 'Gaffer is not available.', true);
    });
  }

  function askPin(note) {
    setText($('pinNote'), note);
    drawPin();
    show('pinScreen');
  }

  function drawPin() {
    var dots = '';
    for (var i = 0; i < pinTyped.length; i++) dots += '\u25CF';
    setText($('pinValue'), dots);
  }

  function buildKeys() {
    var labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Clear', '0', 'Delete'];
    var keys = $('keys');
    for (var i = 0; i < labels.length; i++) {
      (function (label) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.onclick = function () {
          if (label === 'Clear') pinTyped = '';
          else if (label === 'Delete') pinTyped = pinTyped.slice(0, -1);
          else if (pinTyped.length < 6) pinTyped += label;
          drawPin();
          if (pinTyped.length === 6) signIn(pinTyped, false);
        };
        keys.appendChild(b);
      })(labels[i]);
    }
  }

  function blocked(text, canRetry) {
    setText($('blockedText'), text);
    $('retry').hidden = !canRetry;
    show('blocked');
    if (canRetry) later(check);
  }

  // Ask again after a pause that doubles each time, as the Glass page's socket does (400 ms up to 8 s).
  var retryTimer = null;
  function later(fn) {
    if (retryTimer) clearTimeout(retryTimer);
    var delay = Math.min(8000, 400 * Math.pow(2, retry++));
    retryTimer = setTimeout(function () { retryTimer = null; fn(); }, delay);
  }

  // -- the studio ------------------------------------------------------------------------------

  function openStudio() {
    show('studio');
    connect();
  }

  function connect() {
    if (socket) return;
    setStatus('Connecting', false);
    var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var ws = new WebSocket(scheme + location.host + '/ws');
    socket = ws;
    ws.onopen = function () { retry = 0; setStatus('Connected', false); };
    ws.onmessage = function (event) {
      var m;
      try { m = JSON.parse(event.data); } catch (e) { return; }
      receive(m);
    };
    ws.onclose = function (event) {
      if (socket === ws) socket = null;
      setStatus('Reconnecting', true);
      // 4401 is a sign-out (New PIN) or a restart that forgot this browser; 4403 is phone access off.
      if (event.code === 4401 || event.code === 4403) return later(check);
      later(function () { check(); });
    };
  }

  function send(message) {
    if (!socket || socket.readyState !== 1) {
      flash('Not connected yet.');
      return;
    }
    rid += 1;
    message.rid = 'k' + rid;
    socket.send(JSON.stringify(message));
  }

  function setStatus(text, bad) {
    setText($('status'), text);
    var cls = bad ? 'bad' : '';
    if ($('status').className !== cls) $('status').className = cls;
  }

  var flashTimer = null;
  function flash(text) {
    setText($('message'), text);
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { setText($('message'), ''); }, 6000);
  }

  function receive(m) {
    switch (m.type) {
      case 'hello':
        setLights(m.lights || []);
        setLooks((m.store && m.store.looks) || []);
        setLook(m.look);
        break;
      case 'lights':
        setLights(m.lights || []);
        break;
      case 'state':
        if (lights[m.light]) { lights[m.light].state = m.state; drawLight(m.light); }
        break;
      case 'stats':
        for (var id in lights) {
          var reach = m.reachable ? m.reachable[id] : undefined;
          var held = m.held ? m.held[id] : undefined;
          if ((reach !== undefined && lights[id].reachable !== reach) || (held !== undefined && lights[id].held !== held)) {
            if (reach !== undefined) lights[id].reachable = reach;
            if (held !== undefined) lights[id].held = held;
            drawLight(id);
          }
        }
        break;
      case 'store':
        if (m.collection === 'looks') setLooks(m.items || []);
        break;
      case 'look':
        setLook(m.name);
        break;
      case 'cue':
        setCue(m);
        break;
      case 'error':
        flash(m.text || 'That did not work.');
        break;
      case 'toast':
        if (m.kind === 'error' || m.kind === 'warn') flash(m.text);
        break;
    }
  }

  function setLook(name) {
    setText($('lookNow'), name ? 'Look: ' + name : 'No look on');
  }

  function setCue(m) {
    var active = !!m.id;
    $('cue').hidden = !active;
    if (!active) return;
    setText($('cueGo'), m.next ? 'Go: ' + m.next.name : 'Start again');
  }

  function setLooks(items) {
    var same = items.length === looksList.length;
    for (var i = 0; same && i < items.length; i++) {
      if (items[i].id !== looksList[i].id || items[i].name !== looksList[i].name) same = false;
    }
    looksList = items;
    $('looksSection').hidden = items.length === 0;
    if (same) return;
    var box = $('looks');
    while (box.firstChild) box.removeChild(box.firstChild);
    for (var j = 0; j < items.length; j++) {
      (function (look) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = look.name;
        b.onclick = function () { send({ type: 'looks.apply', id: look.id }); };
        box.appendChild(b);
      })(items[j]);
    }
  }

  function setLights(list) {
    var ids = [];
    for (var i = 0; i < list.length; i++) {
      lights[list[i].id] = list[i];
      ids.push(list[i].id);
    }
    if (ids.join('\n') !== order.join('\n')) {
      order = ids;
      var box = $('lights');
      while (box.firstChild) box.removeChild(box.firstChild);
      rows = {};
      for (var j = 0; j < ids.length; j++) box.appendChild(buildRow(ids[j]));
    }
    for (var k = 0; k < ids.length; k++) drawLight(ids[k]);
    var none = ids.length === 0;
    if ($('empty').hidden === none) $('empty').hidden = !none;
  }

  function hasWhite(light) {
    var f = light.caps && light.caps.features;
    return !!(f && f.white && !f.daylight);
  }

  function button(text, onclick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    b.onclick = onclick;
    return b;
  }

  function control(label, minus, plus) {
    var row = document.createElement('div');
    row.className = 'ctl';
    var down = button('\u2212', minus);
    down.setAttribute('aria-label', label + ' down');
    var up = button('+', plus);
    up.setAttribute('aria-label', label + ' up');
    var val = document.createElement('div');
    val.className = 'val';
    var num = document.createElement('span');
    var small = document.createElement('small');
    small.textContent = label === 'Colour temperature' ? 'Colour temp' : label;
    val.appendChild(num);
    val.appendChild(small);
    row.appendChild(down);
    row.appendChild(val);
    row.appendChild(up);
    return { row: row, value: num };
  }

  function buildRow(id) {
    var light = lights[id];
    var root = document.createElement('div');
    root.className = 'light';
    var head = document.createElement('div');
    head.className = 'head';
    var titles = document.createElement('div');
    var name = document.createElement('div');
    name.className = 'name';
    var note = document.createElement('div');
    note.className = 'note';
    titles.appendChild(name);
    titles.appendChild(note);
    var power = button('On', function () {
      var l = lights[id];
      send({ type: 'power', light: id, on: !(l.state && l.state.power) });
    });
    power.className = 'power';
    head.appendChild(titles);
    head.appendChild(power);
    root.appendChild(head);
    // Brightness and colour temperature share one row, so each light takes two rows, not three.
    var ctls = document.createElement('div');
    ctls.className = 'ctls';
    var level = control('Brightness', function () { nudge(id, -LEVEL_STEP, 0); }, function () { nudge(id, LEVEL_STEP, 0); });
    ctls.appendChild(level.row);
    var kelvin = null;
    if (hasWhite(light)) {
      kelvin = control('Colour temperature', function () { nudge(id, 0, -KELVIN_STEP); }, function () { nudge(id, 0, KELVIN_STEP); });
      ctls.appendChild(kelvin.row);
    }
    root.appendChild(ctls);
    rows[id] = { root: root, name: name, note: note, power: power, level: level.value, kelvin: kelvin && kelvin.value };
    return root;
  }

  function nudge(id, levelStep, kelvinStep) {
    var l = lights[id];
    if (!l || !l.state) return;
    if (levelStep) {
      var level = Math.max(0, Math.min(100, Math.round(l.state.brightness) + levelStep));
      send({ type: 'set', light: id, patch: { brightness: level, power: true } });
    }
    if (kelvinStep) {
      var caps = l.caps || {};
      var k = (l.state.cct && l.state.cct.kelvin) || caps.min_kelvin;
      k = Math.max(caps.min_kelvin, Math.min(caps.max_kelvin, k + kelvinStep));
      send({ type: 'set', light: id, patch: { mode: 'cct', cct: { kelvin: k } } });
    }
  }

  function drawLight(id) {
    var l = lights[id];
    var r = rows[id];
    if (!l || !r) return;
    var s = l.state || {};
    var on = !!s.power;
    setText(r.name, l.name || l.model || 'Light');
    var note = l.reachable === false ? 'Out of reach' : (l.held ? 'Held by another app' : (l.model || ''));
    setText(r.note, note);
    setText(r.power, on ? 'On' : 'Off');
    if (r.power.getAttribute('aria-pressed') !== String(on)) r.power.setAttribute('aria-pressed', String(on));
    var cls = on ? 'light' : 'light off';
    if (r.root.className !== cls) r.root.className = cls;
    setText(r.level, Math.round(s.brightness || 0) + '%');
    if (r.kelvin) setText(r.kelvin, s.mode === 'cct' && s.cct ? s.cct.kelvin + ' K' : 'Colour');
  }

  $('allOn').onclick = function () { send({ type: 'power.all', on: true }); };
  $('allOff').onclick = function () { send({ type: 'all.off' }); };
  $('cueGo').onclick = function () { send({ type: 'cue.go' }); };
  $('cueBack').onclick = function () { send({ type: 'cue.back' }); };
  $('retry').onclick = function () { retry = 0; check(); };

  buildKeys();
  check();
})();
</script>
</body>
</html>
